<script>
"use strict";
/* ================================================================
   Longevity-Tresor — persönlicher Health-, Longevity- & Performance-Agent
   Sicherheit: Alle Inhalte werden im Browser mit AES-256-GCM verschlüsselt.
   Der Schlüssel wird aus deiner PIN abgeleitet (PBKDF2-SHA-256, 600.000 Runden).
   Die PIN selbst wird nirgends gespeichert. Gespeichert wird nur Ciphertext:
   im privaten Claude-Speicher (data/users/<deine-id>/, nur für dich lesbar)
   oder, außerhalb von Claude, im localStorage dieses Browsers.
   ================================================================ */

const VERSION = 1;
const ITER = 600000;
const LS = "lt:";

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {

    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "value") value = v;
    else if (k === "checked") e.checked = !!v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  if (value !== undefined) e.value = value;

}
const svgNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, ...kids) { const e = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); kids.forEach(k => e.append(k)); return e; }
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 16) : Math.random().toString(36).slice(2, 18));
const todayStr = (d = new Date()) => d.toLocaleDateString("sv-SE");
const nowTime = () => new Date().toTimeString().slice(0, 5);
const monthOf = (date) => date.slice(0, 7);
const addDays = (date, n) => { const d = new Date(date + "T12:00:00"); d.setDate(d.getDate() + n); return todayStr(d); };
const fmtDate = (date) => new Date(date + "T12:00:00").toLocaleDateString("de-AT", { weekday: "short", day: "numeric", month: "short" });
const fmtLong = (date) => new Date(date + "T12:00:00").toLocaleDateString("de-AT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const num = (v) => (v === "" || v == null || isNaN(+v)) ? null : +v;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function lsGet(k) { try { return localStorage.getItem(LS + k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, v); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(LS + k); } catch {} }

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = el("div", { class: "toast", role: "status", text: msg });

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3200);

/* ---------- crypto ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf) { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

  const base = await crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)));
  return { v: VERSION, iv: b64(iv), ct: b64(ct) };
}

  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(rec.iv) }, key, unb64(rec.ct));
  return JSON.parse(td.decode(pt));
}

/* ---------- storage: private Claude store, or this browser ---------- */
const Store = {
  mode: "local", db: null, base: null, ready: null,
  init() {
    if (this.ready) return this.ready;
    this.ready = (async () => {
      try {
        if (!window.claude || typeof window.claude.use !== "function") return;
        const [db, user] = await Promise.all([withTimeout(window.claude.use("db"), 12000), withTimeout(window.claude.use("user"), 12000)]);
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        this.db = db; this.base = "data/users/" + id; this.mode = "cloud";
      } catch (e) { this.mode = "local"; }
    })();
    return this.ready;
  },
  ref(name) { return this.db.doc(this.base + "/" + name); },
  async get(name) {
    if (this.mode === "cloud") {
      try { const s = await this.ref(name).get(); return s.exists ? s.data() : null; }

  },

    if (this.mode === "cloud") return this.ref(name).delete();
    lsDel(name);
  },
};

  chains[name] = (chains[name] || Promise.resolve()).then(() => Store.set(name, data)).catch(err => {
    console.error(err);
    toast(err && err.code === "quota_exceeded" ? "Speicher voll. Lösche alte Fotos oder exportiere ein Backup." : "Speichern fehlgeschlagen. Prüfe die Verbindung, ich versuche es bei der nächsten Änderung erneut.");
  });

/* ---------- vault state ---------- */
let KEY = null, META = null, S = null;
const dirty = new Set();
let saveTimer = null;

  return {
    profile: { answers: {}, skipped: {}, settings: { autolock: 5 }, created: todayStr(), dailyQ: {}, stackReview: null },
    facts: [], labs: [], supps: [], chat: [], index: { months: [] }, months: {},
  };
}
const CORE = ["profile", "facts", "labs", "supps", "chat", "index"];
function slice(name) {
  if (name.startsWith("m-")) return S.months[name.slice(2)];
  if (name === "facts" || name === "labs" || name === "supps" || name === "chat") return { items: S[name] };
  return S[name];
}
function save(name) { dirty.add(name); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush() {
  clearTimeout(saveTimer);
  if (!KEY || !S) return;
  const names = [...dirty]; dirty.clear();
  const jobs = [];
  for (const n of names) {
    const data = slice(n);
    if (!data) continue;
    if (n === "chat" && S.chat.length > 160) S.chat = S.chat.slice(-160);
    const rec = await encWith(KEY, n === "chat" ? { items: S.chat } : data);
    jobs.push(queueSet(n, rec));
  }
  await Promise.all(jobs);
}
function month(mk) {
  if (!S.months[mk]) {
    S.months[mk] = { checkins: {}, meals: [], water: {}, taken: {} };
    if (!S.index.months.includes(mk)) { S.index.months.push(mk); S.index.months.sort(); save("index"); }
  }
  return S.months[mk];
}
const checkinOf = (date) => (S.months[monthOf(date)] || {}).checkins?.[date] || null;
const mealsOf = (date) => ((S.months[monthOf(date)] || {}).meals || []).filter(m => m.date === date).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
const takenOf = (date) => (S.months[monthOf(date)] || {}).taken?.[date] || [];
const waterOf = (date) => (S.months[monthOf(date)] || {}).water?.[date] || 0;

async function loadVault() {
  S = emptyState();
  for (const n of CORE) {
    const rec = await Store.get(n);
    if (!rec) continue;
    const d = await decWith(KEY, rec);
    if (n === "profile") S.profile = Object.assign(S.profile, d);
    else if (n === "index") S.index = d;
    else S[n] = d.items || [];
  }
  for (const mk of S.index.months || []) {
    const rec = await Store.get("m-" + mk);
    if (rec) S.months[mk] = Object.assign({ checkins: {}, meals: [], water: {}, taken: {} }, await decWith(KEY, rec));
  }
}
async function saveImage(dataUrl) {
  const id = uid();
  imgCache.set(id, dataUrl);
  await queueSet("img-" + id, await encWith(KEY, { d: dataUrl }));
  return id;
}
async function loadImage(id) {
  if (!id) return null;
  if (imgCache.has(id)) return imgCache.get(id);
  try { const rec = await Store.get("img-" + id); if (!rec) return null; const { d } = await decWith(KEY, rec); imgCache.set(id, d); return d; }
  catch { return null; }
}
async function deleteImage(id) { if (!id) return; imgCache.delete(id); try { await Store.del("img-" + id); } catch {} }
function allImageIds() {
  const ids = new Set();
  S.supps.forEach(s => (s.photos || []).forEach(p => ids.add(p)));
  Object.values(S.months).forEach(m => (m.meals || []).forEach(x => x.img && ids.add(x.img)));
  return [...ids];
}

/* ---------- images ---------- */
async function readImage(file) {
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); return img; }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
function scaled(img, max) {
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * r)); c.height = Math.max(1, Math.round(img.naturalHeight * r));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function prepPhoto(file) {
  const img = await readImage(file);
  const store = scaled(img, 720).toDataURL("image/jpeg", 0.72);
  const big = await new Promise(r => scaled(img, 1500).toBlob(r, "image/jpeg", 0.85));
  return { store, blob: big };
}

/* ---------- Claude (sample) ---------- */
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && typeof window.claude.use === "function") ? withTimeout(window.claude.use("sample"), 12000) : Promise.resolve(null);
  return samplePromise;
}
let sampleBlocked = false;
function sampleErr(e) {
  const c = e && e.code;
  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { sampleBlocked = true; return "Claude ist für diese Seite nicht freigegeben. Du kannst es in den Berechtigungen der Seite erlauben."; }
  if (c === "rate_limited") return "Gerade zu viele Anfragen. Versuch es in ein paar Minuten noch einmal.";
  if (c === "session_expired") return "Bitte melde dich bei Claude neu an.";
  if (c === "image_rejected" || c === "images_unavailable") return "Das Foto konnte nicht gelesen werden. Versuch ein anderes Bild (JPEG oder PNG).";
  if (c === "refused") return "Claude hat diese Anfrage abgelehnt. Formuliere sie anders.";
  if (c === "invalid_json") return "Die Antwort war unvollständig. Tippe noch einmal.";
  if (c === "cancelled") return "";
  return "Verbindung zu Claude unterbrochen. Versuch es noch einmal.";
}

/* ---------- sparkline ---------- */
function spark(points, fixed) {
  const W = 140, H = 34, P = 3;
  const vals = points.map(p => p.v).filter(v => v != null);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img" });
  s.append(svg("line", { x1: 0, x2: W, y1: H - P, y2: H - P, class: "spark-grid" }));
  if (!vals.length) return s;
  let lo = fixed ? fixed[0] : Math.min(...vals), hi = fixed ? fixed[1] : Math.max(...vals);
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => P + (i * (W - 2 * P)) / Math.max(1, points.length - 1);
  const y = v => H - P - ((v - lo) / (hi - lo)) * (H - 2 * P);
  let d = "", area = "", seg = [];
  const flushSeg = () => {
    if (!seg.length) return;
    d += seg.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + " ";
    if (seg.length > 1) area += `M${seg[0][0].toFixed(1)} ${H - P} ` + seg.map(p => "L" + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + ` L${seg[seg.length - 1][0].toFixed(1)} ${H - P} Z `;
    seg = [];
  };
  points.forEach((p, i) => { if (p.v == null) flushSeg(); else seg.push([x(i), y(p.v)]); });
  flushSeg();
  if (area) s.append(svg("path", { d: area, class: "spark-area" }));
  s.append(svg("path", { d, class: "spark-line" }));
  for (let i = points.length - 1; i >= 0; i--) if (points[i].v != null) { s.append(svg("circle", { cx: x(i), cy: y(points[i].v), r: 2.6, class: "spark-dot" })); break; }
  return s;
}

${opts.images ? "Ein Foto der Mahlzeit ist angehängt." : ""}

    el("div", { class: "grid2" }, field("Fett", numIn("meal-f", m.fat, "g")), field("Ballaststoffe", numIn("meal-fi", m.fiber, "g"))),

/* ---------- PIN change / backup / wipe ---------- */
function allDocNames() { return [...CORE, ...S.index.months.map(m => "m-" + m)]; }
async function changePin(newPin) {
  await flush();
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  const nk = await deriveKey(newPin, salt, ITER);
  const recs = {};
  for (const n of allDocNames()) { const d = n === "chat" ? { items: S.chat } : slice(n); if (d) recs[n] = await encWith(nk, d); }
  const imgs = {};
  for (const id of allImageIds()) { const d = await loadImage(id); if (d) imgs[id] = await encWith(nk, { d }); }
  const meta = { v: VERSION, salt, iter: ITER, check: await encWith(nk, { ok: true }), created: META.created, changed: new Date().toISOString() };
  // meta-next lets the new PIN unlock if the switch is interrupted after the data was rewritten
  await Store.set("meta-next", meta);
  for (const [n, r] of Object.entries(recs)) await Store.set(n, r);
  for (const [id, r] of Object.entries(imgs)) await Store.set("img-" + id, r);
  await Store.set("meta", meta);
  await Store.del("meta-next");
  META = meta; KEY = nk;
}
async function exportBackup(msg) {
  msg.textContent = "Erstelle Backup …";
  try {
    await flush();
    const images = {};
    for (const id of allImageIds()) { const d = await loadImage(id); if (d) images[id] = d; }
    const bundle = { app: "longevity-tresor", v: VERSION, exported: new Date().toISOString(), state: { profile: S.profile, facts: S.facts, labs: S.labs, supps: S.supps, chat: S.chat, index: S.index, months: S.months }, images };
    const file = { app: "longevity-tresor-backup", v: VERSION, salt: META.salt, iter: META.iter, data: await encWith(KEY, bundle) };
    const json = JSON.stringify(file);
    const downloads = window.claude && typeof window.claude.use === "function" ? await withTimeout(window.claude.use("downloads"), 12000) : null;
    const fname = `longevity-tresor-${todayStr()}.json`;
    if (downloads) { await downloads.save({ filename: fname, data: new Blob([json], { type: "application/json" }) }); msg.textContent = "Backup gespeichert."; }
    else {
      const a = el("a", { href: URL.createObjectURL(new Blob([json], { type: "application/json" })), download: fname });
      document.body.append(a); a.click(); a.remove(); msg.textContent = "Backup heruntergeladen.";
    }

}

    el("div", { class: "row" },
      el("button", { class: "btn danger", onclick: async () => {
        msg.textContent = "Entschlüssele …";

          const k = await deriveKey(pinIn.value, parsed.salt, parsed.iter);

/* ================================================================
   LOCK / UNLOCK
   ================================================================ */
let lastAct = Date.now(), hiddenAt = null;
["pointerdown", "keydown", "touchstart", "scroll"].forEach(ev => window.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
setInterval(() => { if (KEY && S && Date.now() - lastAct > (S.profile.settings.autolock || 5) * 60000 && !chatCtl) lock(); }, 15000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); if (KEY) flush(); }
  else if (KEY && hiddenAt && Date.now() - hiddenAt > 120000) lock();

async function lock() {
  try { await flush(); } catch {}
  if (chatCtl) chatCtl.abort();
  KEY = null; S = null; imgCache.clear(); IV = null; closeSheet();
  showLock();
}
function fails() { try { return JSON.parse(lsGet("fails") || '{"n":0,"until":0}'); } catch { return { n: 0, until: 0 }; } }

async function showLock() {
  app.innerHTML = "";

  const card = el("div", { class: "lock-card" }, mark(), el("p", { class: "label", text: "Verbinde mit deinem Speicher …" }));
  card.firstChild.setAttribute("class", "lock-mark");
  wrap.append(card); app.append(wrap);
  await Store.init();
  let meta = null;
  try { meta = await Store.get("meta"); } catch (e) { card.lastChild.textContent = "Der Speicher ist gerade nicht erreichbar. Lade die Seite neu."; return; }

  setSub();
  const draw = () => { dots.innerHTML = ""; const n = Math.max(MIN_PIN, pin.length); for (let i = 0; i < n; i++) dots.append(el("i", { class: i < pin.length ? "on" : "" })); };
  draw();
  let busy = false;
  const press = (k) => {
    if (busy) return;

    if (pin.length < MIN_PIN) { shake(`Mindestens ${MIN_PIN} Ziffern.`); return; }

      if (pin !== first) { first = null; setSub(); shake("Die PINs stimmen nicht überein. Noch einmal von vorn."); return; }
      busy = true; err.textContent = ""; sub.textContent = "Erzeuge deinen Schlüssel …";
      try {
        const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
        KEY = await deriveKey(pin, salt, ITER);
        META = { v: VERSION, salt, iter: ITER, check: await encWith(KEY, { ok: true }), created: new Date().toISOString() };
        await Store.set("meta", META);
        S = emptyState();
        CORE.forEach(n => dirty.add(n)); await flush();
        pin = ""; first = null;
        lastAct = Date.now(); TAB = "heute"; shell();
        setTimeout(() => openInterview(0), 250);
      } catch (e) { console.error(e); KEY = null; busy = false; sub.textContent = "Der Tresor konnte nicht angelegt werden. Lade die Seite neu und versuch es noch einmal."; }
      return;
    }
    const f = fails();

    try {
      let m = meta, k = await deriveKey(pin, m.salt, m.iter);
      try { await decWith(k, m.check); }
      catch (e1) {
        const next = await Store.get("meta-next").catch(() => null);
        if (!next) throw e1;
        k = await deriveKey(pin, next.salt, next.iter); await decWith(k, next.check);
        m = next; await Store.set("meta", next); await Store.del("meta-next");
      }
      KEY = k; META = m;
      await loadVault();
      lsDel("fails"); pin = "";
      lastAct = Date.now(); TAB = "heute"; shell();
      if (answeredCount() === 0) setTimeout(() => openInterview(0), 250);
    } catch (e) {
      busy = false; setSub(); KEY = null; S = null;
      if (e && e.name === "OperationError") {
        const n = f.n + 1;
        const wait = n >= 5 ? Math.min(3600, 30 * 2 ** (n - 5)) : 0;

        shake(wait ? `Falsche PIN. Nächster Versuch in ${wait} Sekunden.` : `Falsche PIN. Noch ${5 - n} Versuche ohne Wartezeit.`);
      } else { console.error(e); shake("Deine Daten konnten nicht geladen werden. Prüfe die Verbindung."); }
    }

  const pad = el("div", { class: "pad" });
  ["1", "2", "3", "4", "5", "6", "7", "8", "9"].forEach(d => pad.append(el("button", { type: "button", onclick: () => press(d), text: d })));
  pad.append(el("button", { type: "button", class: "fn", "aria-label": "Löschen", onclick: () => press("del"), text: "Löschen" }));
