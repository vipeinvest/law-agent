name: Zeitly CI
# One run per change: pull requests, plus pushes to main. (push on feature branches would double every run and every failure mail.)
on:
  pull_request:
    paths: ['apps/zeitly/**', '.github/workflows/zeitly-ci.yml', '.github/workflows/zeitly-deploy.yml']
  push:
    branches: [main]
    paths: ['apps/zeitly/**', '.github/workflows/zeitly-ci.yml']
concurrency:
  group: zeitly-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # ubuntu-latest moved to 26.04, for which Playwright 1.56 has no system-dependency recipe
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/zeitly } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/zeitly/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/gen-migrations.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env: { ZEITLY_DB: pglite, ZEITLY_DEMO: '1', SESSION_SECRET: ci-secret-ci-secret-ci-secret-1234 }
      - run: npx playwright install --with-deps chromium
      - run: pnpm e2e
        env: { ZEITLY_DB: pglite, ZEITLY_DEMO: '1', SESSION_SECRET: ci-secret-ci-secret-ci-secret-1234, APP_URL: http://127.0.0.1:3100 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/zeitly/playwright-report }
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/zeitly
          push: false
          tags: zeitly:ci
          build-args: GIT_SHA=${{ github.sha }}
